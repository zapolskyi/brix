name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php:
    name: PHP — стандарти коду
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr
          coverage: none

      # Інструменти перевірки ставимо з composer.lock плагіна — тих
      # самих версій, якими код перевіряється локально. Тема й плагін
      # не мають залежностей у рантаймі: це лише PHPCS зі стандартами.
      - name: Інструменти перевірки
        working-directory: plugins/brix-core
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Синтаксис PHP
        run: find themes/brix plugins/brix-core -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      # -q обов'язковий: у phpcs.xml.dist увімкнений показ прогресу, і його
      # крапки потрапляли б у XML-звіт, який cs2pr не може розібрати.
      - name: PHPCS
        run: plugins/brix-core/vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=checkstyle | cs2pr

  assets:
    name: Складання стилів і синтаксис JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Залежності
        working-directory: themes/brix
        run: npm ci || npm install

      # У git лежить розгорнутий CSS (`npm run css`), а стиснений
      # `npm run build` збирає лише архів для хостингу. Порівнювати
      # треба те, що справді закомічено.
      - name: Складання CSS
        working-directory: themes/brix
        run: npm run css

      # Скомпільований CSS комітиться, тож він має збігатися з
      # джерелом: інакше на хостинг поїде застарілий файл.
      - name: Чи CSS відповідає джерелу
        run: |
          if ! git diff --quiet -- themes/brix/assets/css; then
            echo 'assets/css відрізняється від складеного з SCSS. Запустіть npm run build і закомітьте результат.'
            git --no-pager diff --stat -- themes/brix/assets/css
            exit 1
          fi

      - name: Синтаксис JS
        working-directory: themes/brix
        run: for f in assets/js/*.js tools/*.mjs; do node --check "$f" || exit 1; done
